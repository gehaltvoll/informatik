<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!-- Entscheidungen:
  Einsatztyp: Lernmaterial Informatik (Kryptologie), Unterricht + Selbststudium, mit Beamer-Modus-Schalter
  Funktion: Schritt-für-Schritt-Simulation (Vor/Zurück, Pfeiltasten, Sprungliste), Klartext (8 Bit) und Schlüssel (10 Bit) frei wählbar, Beispiel/Zufall
  Umfang: Rundenschlüssel-Erzeugung (P10, LS-1, P8, LS-2, P8) + Verschlüsselung (IP, 2 Feistel-Runden, SW, IP⁻¹); nur Verschlüsselung, keine Entschlüsselung
  Detailtiefe: jede Bitposition sichtbar, Permutationen als Liniendiagramm (Ausgabebit überfahren hebt Linie hervor), 1–3 Sätze Erklärung pro Schritt
  Datenhaltung: nur localStorage für Variante und Beamer-Modus (Komfort)
  Design: Nord-Farbschema, Open Sans + Google Sans Code; Hell/Dunkel folgt System
  Variante A «Klar»: hell, feine Linien, Bits als umrandete Zellen, Frost nur als Akzent
  Variante B «Technisch»: Polar-Night-Kopf, gefüllte Bit-Kacheln, Labels in Google Sans Code
  Beispielwerte: Lehrbuch-Testvektor (Stallings) Schlüssel 1010000010, Klartext 10010111 → Geheimtext 00111000
-->
<title>S-DES Schritt für Schritt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,400;0,600;1,400&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: Kopf mit Eingaben, darunter Schrittliste (links) + aktueller Schritt (Mitte) + Zwischenwerte */
:root {
  --nord0:#2E3440; --nord1:#3B4252; --nord2:#434C5E; --nord3:#4C566A;
  --nord4:#D8DEE9; --nord5:#E5E9F0; --nord6:#ECEFF4;
  --nord7:#8FBCBB; --nord8:#88C0D0; --nord9:#81A1C1; --nord10:#5E81AC;
  --nord11:#BF616A; --nord12:#D08770; --nord13:#EBCB8B; --nord14:#A3BE8C; --nord15:#B48EAD;

  --bg: var(--nord6); --surface: var(--nord5); --surface-2: var(--nord4);
  --text: var(--nord0); --text-muted: var(--nord3);
  --accent: var(--nord10); --accent-soft: var(--nord9);
  --head-dark: var(--nord0); --head-dark-fg: var(--nord6); --head-dark-muted: var(--nord4);
  --ok: var(--nord14); --warn: var(--nord13); --err: var(--nord11); --special: var(--nord15); --info: var(--nord8);
  --row-mark: var(--nord12); --col-mark: var(--nord15);

  --font: "Open Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Google Sans Code", ui-monospace, "Cascadia Code", Consolas, "SF Mono", monospace;
  --base: 17px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: var(--nord0); --surface: var(--nord1); --surface-2: var(--nord2);
    --text: var(--nord6); --text-muted: var(--nord4);
    --accent: var(--nord8); --accent-soft: var(--nord9);
    --head-dark: var(--nord1); --head-dark-fg: var(--nord6); --head-dark-muted: var(--nord4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: var(--nord0); --surface: var(--nord1); --surface-2: var(--nord2);
  --text: var(--nord6); --text-muted: var(--nord4);
  --accent: var(--nord8); --accent-soft: var(--nord9);
  --head-dark: var(--nord1); --head-dark-fg: var(--nord6); --head-dark-muted: var(--nord4);
  color-scheme: dark;
}

/* Variante A – Klar */
[data-variant="a"] {
  --head-bg: transparent; --head-fg: var(--text); --head-muted: var(--text-muted); --head-border: var(--surface-2);
  --card-bg: var(--bg); --card-border: var(--surface-2); --radius: 4px;
  --bit1-bg: transparent; --bit1-fg: var(--text); --bit1-stroke: var(--accent); --bit1-weight: 600;
  --bit0-bg: transparent; --bit0-fg: var(--text-muted); --bit0-stroke: var(--surface-2);
  --line: var(--surface-2); --line-hi: var(--accent);
  --label-font: var(--font); --label-transform: none; --label-spacing: 0;
  --step-active-bg: var(--surface); --step-active-mark: var(--accent);
  --h-weight: 600;
}
/* Variante B – Technisch */
[data-variant="b"] {
  --head-bg: var(--head-dark); --head-fg: var(--head-dark-fg); --head-muted: var(--head-dark-muted); --head-border: var(--head-dark);
  --card-bg: var(--surface); --card-border: var(--surface); --radius: 2px;
  --bit1-bg: var(--accent-soft); --bit1-fg: var(--nord0); --bit1-stroke: var(--accent-soft); --bit1-weight: 600;
  --bit0-bg: var(--surface-2); --bit0-fg: var(--text-muted); --bit0-stroke: var(--surface-2);
  --line: var(--nord3); --line-hi: var(--nord8);
  --label-font: var(--font-mono); --label-transform: uppercase; --label-spacing: .06em;
  --step-active-bg: var(--head-dark); --step-active-mark: var(--nord8);
  --h-weight: 700;
}
[data-beamer="1"] { --base: 22px; }

*, *::before, *::after { box-sizing: border-box; }
html { font-size: var(--base); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 1rem; line-height: 1.6;
}
[data-beamer="1"] body { font-weight: 600; }
button, input { font: inherit; color: inherit; }
code, .mono { font-family: var(--font-mono); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Kopf */
.head { background: var(--head-bg); color: var(--head-fg); border-bottom: 1px solid var(--head-border); }
.wrap {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.head .wrap { padding-block: 18px 20px; display: grid; gap: 14px; }
.toprow { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: baseline; justify-content: space-between; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; line-height: 1.2; text-wrap: balance; }
.sub { margin: 2px 0 0; color: var(--head-muted); font-size: .9rem; }
.toggles { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--head-muted); border-radius: var(--radius); overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 4px 12px; cursor: pointer; font-size: .85rem; color: var(--head-fg); }
.seg button[aria-pressed="true"] { background: var(--head-fg); color: var(--head-bg); }
[data-variant="a"] .seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.chip-btn { border: 1px solid var(--head-muted); background: transparent; border-radius: var(--radius); padding: 4px 12px; cursor: pointer; font-size: .85rem; color: var(--head-fg); }
.chip-btn[aria-pressed="true"] { border-color: var(--head-fg); font-weight: 600; }

.inputs { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; }
.field { display: grid; gap: 4px; }
.field label { font-size: .8rem; color: var(--head-muted); font-family: var(--label-font); text-transform: var(--label-transform); letter-spacing: var(--label-spacing); }
.field input {
  font-family: var(--font-mono); font-size: 1.05rem; letter-spacing: .18em;
  padding: 6px 10px; border-radius: var(--radius); width: 15ch;
  border: 1px solid var(--head-muted); background: var(--bg); color: var(--text);
}
.field input.key { width: 18ch; }
.field input[aria-invalid="true"] { border-color: var(--err); border-width: 2px; }
.field .err { font-size: .8rem; color: var(--head-fg); min-height: 1.2em; }
.field .err:not(:empty)::before { content: "✗ "; color: var(--err); font-weight: 700; }
.inputs .btns { display: flex; gap: 8px; padding-bottom: 1.4em; }
.result-pill { padding-bottom: 1.4em; font-size: .9rem; color: var(--head-muted); }
.result-pill b { font-family: var(--font-mono); color: var(--head-fg); letter-spacing: .12em; font-weight: 600; }

/* Hauptbereich */
.main .wrap { padding-block: 22px 40px; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 860px) { .main .wrap { grid-template-columns: minmax(0, 1fr); } }

/* Schrittliste */
.steps summary { cursor: pointer; font-weight: 600; padding: 6px 0; }
@media (min-width: 861px) { .steps summary { display: none; } }
.steps ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.grp { margin: 12px 0 4px; font-size: .75rem; color: var(--text-muted); font-family: var(--label-font); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.grp:first-child { margin-top: 0; }
.steps button {
  width: 100%; text-align: left; background: transparent; border: 0; cursor: pointer;
  padding: 5px 10px; border-radius: var(--radius); display: flex; gap: 10px; font-size: .9rem; line-height: 1.35;
  border-left: 3px solid transparent;
}
.steps button .n { font-family: var(--font-mono); color: var(--text-muted); font-size: .8rem; min-width: 2ch; padding-top: 1px; font-variant-numeric: tabular-nums; }
.steps button:hover { background: var(--surface); }
.steps button.done .t { color: var(--text-muted); }
.steps button[aria-current="step"] { background: var(--step-active-bg); border-left-color: var(--step-active-mark); font-weight: 600; }
[data-variant="b"] .steps button[aria-current="step"] { color: var(--head-dark-fg); }
[data-variant="b"] .steps button[aria-current="step"] .n { color: var(--nord8); }

/* Schrittkarte */
.stage { display: grid; gap: 20px; min-width: 0; }
.card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 22px 24px; min-width: 0; }
@media (max-width: 520px) { .card { padding: 16px; } }
.eyebrow { font-size: .78rem; color: var(--text-muted); font-family: var(--label-font); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; display: flex; gap: 10px; flex-wrap: wrap; }
.eyebrow .cnt { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
h2 { margin: 4px 0 8px; font-size: 1.4rem; font-weight: var(--h-weight); line-height: 1.25; text-wrap: balance; }
.expl { margin: 0 0 12px; max-width: 70ch; }
.table-code { display: inline-block; font-family: var(--font-mono); font-size: .88rem; background: var(--surface); padding: 2px 8px; border-radius: var(--radius); margin-bottom: 14px; }
[data-variant="b"] .table-code { background: var(--bg); }

.viz { overflow-x: auto; padding: 6px 0 4px; }
.viz svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
.hint { font-size: .82rem; color: var(--text-muted); margin: 6px 0 0; }

/* SVG */
.c1 { fill: var(--bit1-bg); stroke: var(--bit1-stroke); stroke-width: 2; }
.c0 { fill: var(--bit0-bg); stroke: var(--bit0-stroke); stroke-width: 1.5; }
.t1 { fill: var(--bit1-fg); font-family: var(--font-mono); font-size: 17px; font-weight: 600; }
.t0 { fill: var(--bit0-fg); font-family: var(--font-mono); font-size: 17px; }
.idx { fill: var(--text-muted); font-family: var(--font-mono); font-size: 11px; }
.lbl { fill: var(--text-muted); font-family: var(--font); font-size: 12px; font-weight: 600; }
.half { fill: var(--text); font-family: var(--font-mono); font-size: 12px; font-weight: 600; }
.ln { stroke: var(--line); stroke-width: 1.4; fill: none; }
.map { cursor: default; }
.map:hover .ln, .map:focus .ln { stroke: var(--line-hi); stroke-width: 3; }
.map:hover .src, .map:focus .src { fill: var(--line-hi); font-weight: 600; }
.map:focus { outline: none; }

/* Bitzeilen (HTML) */
.rows { display: grid; gap: 8px; justify-content: center; }
.brow { display: grid; grid-template-columns: 9.5em auto; align-items: center; gap: 12px; }
@media (max-width: 520px) { .brow { grid-template-columns: 1fr; gap: 4px; } }
.brow .l { font-size: .85rem; color: var(--text-muted); text-align: right; line-height: 1.3; }
@media (max-width: 520px) { .brow .l { text-align: left; } }
.brow .l b { color: var(--text); font-weight: 600; }
.cells { display: flex; gap: 5px; }
.bit {
  width: 2.1em; height: 2.1em; display: grid; place-items: center; border-radius: var(--radius);
  font-family: var(--font-mono); font-size: 1rem; flex: none;
}
.bit.b1 { background: var(--bit1-bg); color: var(--bit1-fg); border: 2px solid var(--bit1-stroke); font-weight: 600; }
.bit.b0 { background: var(--bit0-bg); color: var(--bit0-fg); border: 1.5px solid var(--bit0-stroke); }
.bit.gap { margin-left: 14px; }
.bit.dim { opacity: .35; }
.bit.mr { box-shadow: 0 0 0 3px var(--row-mark); }
.bit.mc { box-shadow: 0 0 0 3px var(--col-mark); }
.rule { border: 0; border-top: 2px solid var(--text); margin: 2px 0; }
.op { font-family: var(--font-mono); font-weight: 600; color: var(--text); }

/* S-Boxen */
.sboxes { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; }
.sbox { display: grid; gap: 10px; justify-items: center; }
.sbox h3 { margin: 0; font-size: 1rem; font-weight: 600; font-family: var(--font-mono); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; font-size: .82rem; color: var(--text-muted); }
.legend span::before { content: ""; display: inline-block; width: .9em; height: .9em; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.legend .lr::before { box-shadow: inset 0 0 0 3px var(--row-mark); }
.legend .lc::before { box-shadow: inset 0 0 0 3px var(--col-mark); }
table.sb { border-collapse: collapse; font-family: var(--font-mono); font-size: .9rem; font-variant-numeric: tabular-nums; }
table.sb th, table.sb td { width: 2.6em; height: 2.1em; text-align: center; border: 1px solid var(--surface-2); }
table.sb th { color: var(--text-muted); font-weight: 400; font-size: .78rem; background: var(--surface); }
[data-variant="b"] table.sb th { background: var(--bg); }
table.sb th.corner { border: 0; background: transparent; }
table.sb th.hr { box-shadow: inset 0 0 0 3px var(--row-mark); color: var(--text); font-weight: 600; }
table.sb th.hc { box-shadow: inset 0 0 0 3px var(--col-mark); color: var(--text); font-weight: 600; }
table.sb td.on { background: var(--accent-soft); color: var(--nord0); font-weight: 600; outline: 2px solid var(--text); outline-offset: -2px; }
.sb-calc { font-size: .88rem; text-align: center; line-height: 1.5; }
.sb-calc code { font-size: .95em; }

/* Navigation */
.nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--surface-2); }
.navbtn {
  padding: 8px 18px; border-radius: var(--radius); cursor: pointer; font-weight: 600;
  border: 1px solid var(--text); background: transparent;
}
.navbtn.primary { background: var(--text); color: var(--bg); }
.navbtn:disabled { opacity: .35; cursor: default; }
.navinfo { font-size: .82rem; color: var(--text-muted); }
.progress { height: 3px; background: var(--surface-2); border-radius: 2px; overflow: hidden; margin-top: 14px; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
@media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }

/* Zwischenwerte */
.vals h3 { margin: 0 0 10px; font-size: .78rem; color: var(--text-muted); font-family: var(--label-font); text-transform: uppercase; letter-spacing: .06em; }
.vals dl { margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px 20px; }
.vals .v { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px dotted var(--surface-2); }
.vals dt { font-size: .85rem; color: var(--text-muted); }
.vals dd { margin: 0; font-family: var(--font-mono); letter-spacing: .12em; font-variant-numeric: tabular-nums; }
.vals .v.new dd { font-weight: 600; color: var(--text); }
.vals .v.new dt { color: var(--text); font-weight: 600; }
.vals .v.new dt::after { content: " · neu"; color: var(--text-muted); font-weight: 400; }
.vals .empty { color: var(--text-muted); font-size: .88rem; margin: 0; }
</style>

<div id="app" data-variant="a">
  <header class="head">
    <div class="wrap">
      <div class="toprow">
        <div>
          <h1>S-DES Schritt für Schritt</h1>
          <p class="sub">Simplified DES: 8-Bit-Block, 10-Bit-Schlüssel, 2 Feistel-Runden</p>
        </div>
        <div class="toggles">
          <div class="seg" role="group" aria-label="Design-Variante">
            <button type="button" id="varA" aria-pressed="true">Variante A</button>
            <button type="button" id="varB" aria-pressed="false">Variante B</button>
          </div>
          <button type="button" class="chip-btn" id="beamer" aria-pressed="false">Beamer-Modus</button>
        </div>
      </div>
      <form class="inputs" id="form" autocomplete="off">
        <div class="field">
          <label for="pt">Klartext · 8 Bit</label>
          <input id="pt" inputmode="numeric" maxlength="8" spellcheck="false" aria-describedby="ptErr">
          <span class="err" id="ptErr" aria-live="polite"></span>
        </div>
        <div class="field">
          <label for="key">Schlüssel · 10 Bit</label>
          <input id="key" class="key" inputmode="numeric" maxlength="10" spellcheck="false" aria-describedby="keyErr">
          <span class="err" id="keyErr" aria-live="polite"></span>
        </div>
        <div class="btns">
          <button type="button" class="chip-btn" id="example">Beispiel</button>
          <button type="button" class="chip-btn" id="random">Zufällig</button>
        </div>
        <div class="result-pill">Geheimtext: <b id="ctOut">--------</b></div>
      </form>
    </div>
  </header>

  <main class="main">
    <div class="wrap">
      <nav class="steps" aria-label="Alle Schritte">
        <details id="stepsDetails" open>
          <summary>Alle Schritte</summary>
          <div id="stepList"></div>
        </details>
      </nav>

      <div class="stage">
        <section class="card" aria-live="polite">
          <div class="eyebrow"><span id="grpName"></span><span class="cnt" id="cnt"></span></div>
          <h2 id="title"></h2>
          <p class="expl" id="expl"></p>
          <div id="tableCode"></div>
          <div class="viz" id="viz"></div>
          <p class="hint" id="hint"></p>
          <div class="progress" aria-hidden="true"><i id="bar"></i></div>
          <div class="nav">
            <button type="button" class="navbtn" id="prev">← Zurück</button>
            <span class="navinfo">Pfeiltasten ← → zum Blättern</span>
            <button type="button" class="navbtn primary" id="next">Weiter →</button>
          </div>
        </section>

        <section class="card vals">
          <h3>Zwischenwerte bis hier</h3>
          <div id="vals"></div>
        </section>
      </div>
    </div>
  </main>
</div>

<script>
(function () {
  "use strict";
  // ---------- S-DES ----------
  const T = {
    P10: [3,5,2,7,4,10,1,9,8,6], P8: [6,3,7,4,8,5,10,9],
    LS1: [2,3,4,5,1,7,8,9,10,6], LS2: [3,4,5,1,2,8,9,10,6,7],
    IP: [2,6,3,1,4,8,5,7], IPI: [4,1,3,5,7,2,8,6],
    EP: [4,1,2,3,2,3,4,1], P4: [2,4,3,1], SW: [5,6,7,8,1,2,3,4]
  };
  const S0 = [[1,0,3,2],[3,2,1,0],[0,2,1,3],[3,1,3,2]];
  const S1 = [[0,1,2,3],[2,0,1,3],[3,0,1,0],[2,1,0,3]];
  const perm = (b, t) => t.map(i => b[i - 1]);
  const xor = (a, b) => a.map((x, i) => x ^ b[i]);
  const str = a => a.join("");
  const sbox = (S, b) => {
    const row = b[0] * 2 + b[3], col = b[1] * 2 + b[2], v = S[row][col];
    return { in: b, row, col, v, out: [v >> 1, v & 1] };
  };
  function round(bits, k) {
    const L = bits.slice(0, 4), R = bits.slice(4);
    const ep = perm(R, T.EP), x = xor(ep, k);
    const s0 = sbox(S0, x.slice(0, 4)), s1 = sbox(S1, x.slice(4));
    const sOut = [...s0.out, ...s1.out], p4 = perm(sOut, T.P4);
    const L2 = xor(L, p4);
    return { L, R, ep, x, s0, s1, sOut, p4, L2, out: [...L2, ...R] };
  }
  function compute(pt, key) {
    const p10 = perm(key, T.P10), a = perm(p10, T.LS1), k1 = perm(a, T.P8);
    const b = perm(a, T.LS2), k2 = perm(b, T.P8);
    const ip = perm(pt, T.IP), r1 = round(ip, k1), sw = perm(r1.out, T.SW);
    const r2 = round(sw, k2), ct = perm(r2.out, T.IPI);
    return { pt, key, p10, a, k1, b, k2, ip, r1, sw, r2, ct };
  }

  // ---------- Darstellung ----------
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function xs(n, split, cell, gap, sg) {
    const a = []; let x = 0;
    for (let i = 0; i < n; i++) { if (split && i === split) x += sg; a.push(x); x += cell + gap; }
    return { a, w: x - gap };
  }
  function cellSVG(x, y, v, s) {
    return `<rect class="c${v}" x="${x}" y="${y}" width="${s}" height="${s}" rx="4"/>` +
      `<text class="t${v}" x="${x + s / 2}" y="${y + s / 2 + 6}" text-anchor="middle">${v}</text>`;
  }
  // Permutation: Eingabezeile oben, Ausgabezeile unten, Linien von Quelle zu Ziel
  function permSVG(o) {
    const s = 38, g = 7, sg = 22, pad = 6;
    const I = xs(o.inBits.length, o.inSplit, s, g, sg), O = xs(o.table.length, o.outSplit, s, g, sg);
    const W = Math.max(I.w, O.w) + pad * 2, oi = (W - I.w) / 2, oo = (W - O.w) / 2;
    const yL = 14, yIdx = 34, yIn = 42, yOut = 152, ySrc = yOut + s + 16, yOL = ySrc + 22, H = yOL + 8;
    let h = `<svg viewBox="0 0 ${W} ${H}" style="width:${(W / 17).toFixed(2)}rem" role="img" aria-label="${esc(o.aria || "Permutation")}">`;
    h += `<text class="lbl" x="${oi}" y="${yL}">${esc(o.inLabel)}</text>`;
    if (o.inHalves) o.inHalves.forEach((t, k) => {
      const from = k === 0 ? 0 : o.inSplit, to = k === 0 ? o.inSplit - 1 : o.inBits.length - 1;
      const cx = oi + (I.a[from] + I.a[to] + s) / 2;
      h += `<text class="half" x="${cx}" y="${yL}" text-anchor="middle">${esc(t)}</text>`;
    });
    o.inBits.forEach((v, i) => {
      h += `<text class="idx" x="${oi + I.a[i] + s / 2}" y="${yIdx}" text-anchor="middle">${i + 1}</text>`;
      h += cellSVG(oi + I.a[i], yIn, v, s);
    });
    o.table.forEach((src, j) => {
      const x1 = oi + I.a[src - 1] + s / 2, x2 = oo + O.a[j] + s / 2, v = o.inBits[src - 1];
      h += `<g class="map" tabindex="0" aria-label="Ausgabebit ${j + 1} kommt von Position ${src}">` +
        `<path class="ln" d="M${x1} ${yIn + s} C ${x1} ${yIn + s + 40}, ${x2} ${yOut - 40}, ${x2} ${yOut}"/>` +
        cellSVG(oo + O.a[j], yOut, v, s) +
        `<text class="idx src" x="${x2}" y="${ySrc}" text-anchor="middle">←${src}</text></g>`;
    });
    h += `<text class="lbl" x="${oo}" y="${yOL}">${esc(o.outLabel)}</text>`;
    if (o.outHalves) o.outHalves.forEach((t, k) => {
      const from = k === 0 ? 0 : o.outSplit, to = k === 0 ? o.outSplit - 1 : o.table.length - 1;
      const cx = oo + (O.a[from] + O.a[to] + s) / 2;
      h += `<text class="half" x="${cx}" y="${yOL}" text-anchor="middle">${esc(t)}</text>`;
    });
    return h + `</svg>`;
  }

  function cells(bits, o = {}) {
    return `<div class="cells">` + bits.map((v, i) => {
      let c = `bit b${v}`;
      if (o.split && i === o.split) c += " gap";
      if (o.dim && o.dim.includes(i)) c += " dim";
      if (o.mr && o.mr.includes(i)) c += " mr";
      if (o.mc && o.mc.includes(i)) c += " mc";
      return `<span class="${c}" aria-label="Bit ${i + 1}: ${v}">${v}</span>`;
    }).join("") + `</div>`;
  }
  const row = (label, bits, o) => `<div class="brow"><div class="l">${label}</div>${cells(bits, o)}</div>`;
  const rule = () => `<div class="brow"><div class="l"></div><hr class="rule"></div>`;
  function xorViz(a, la, b, lb, r, lr, o = {}) {
    return `<div class="rows">${row(la, a, o)}${row(`<span class="op">⊕</span> ${lb}`, b, o)}${rule()}${row(lr, r, o)}</div>`;
  }
  function sboxPanel(name, S, sb) {
    const bin = n => (n >> 1) + "" + (n & 1);
    let t = `<table class="sb" aria-label="${name}"><tr><th class="corner"></th>`;
    for (let c = 0; c < 4; c++) t += `<th class="${c === sb.col ? "hc" : ""}">${bin(c)}</th>`;
    t += `</tr>`;
    for (let r = 0; r < 4; r++) {
      t += `<tr><th class="${r === sb.row ? "hr" : ""}">${bin(r)}</th>`;
      for (let c = 0; c < 4; c++) t += `<td class="${r === sb.row && c === sb.col ? "on" : ""}">${S[r][c]}</td>`;
      t += `</tr>`;
    }
    t += `</table>`;
    return `<div class="sbox"><h3>${name}</h3>${cells(sb.in, { mr: [0, 3], mc: [1, 2] })}` +
      `<div class="sb-calc">Zeile <code>${sb.in[0]}${sb.in[3]}</code> = ${sb.row} · Spalte <code>${sb.in[1]}${sb.in[2]}</code> = ${sb.col}</div>` +
      t + `<div class="sb-calc">Wert ${sb.v} → Ausgabe</div>${cells(sb.out)}</div>`;
  }
  const tcode = (name, t) => `<code class="table-code">${name} = ${t.join(" ")}</code>`;

  // ---------- Schritte ----------
  function buildSteps(d) {
    const st = [];
    const add = (group, short, title, text, viz, extra = {}) => st.push({ group, short, title, text, viz, ...extra });
    const G1 = "Rundenschlüssel", G2 = "Vorbereitung", G5 = "Abschluss";

    add(G1, "10-Bit-Schlüssel", "Der 10-Bit-Schlüssel",
      "S-DES arbeitet mit einem Schlüssel von 10 Bit. Daraus entstehen zwei Rundenschlüssel K1 und K2 mit je 8 Bit, einer pro Runde.",
      () => `<div class="rows">${row("<b>Schlüssel</b>", d.key)}</div>`);
    add(G1, "P10", "Permutation P10",
      "Die 10 Bits werden nach der Tabelle P10 umgeordnet. Unter jedem Ausgabebit steht, von welcher Position es stammt.",
      () => permSVG({ inBits: d.key, table: T.P10, inLabel: "Schlüssel", outLabel: "nach P10" }),
      { code: tcode("P10", T.P10), hint: true });
    add(G1, "LS-1", "Teilen und Linksshift um 1",
      "Das Ergebnis wird in zwei Hälften zu 5 Bit geteilt. Jede Hälfte wird zyklisch um 1 Position nach links verschoben: Das vorderste Bit wandert ans Ende.",
      () => permSVG({ inBits: d.p10, table: T.LS1, inSplit: 5, outSplit: 5, inLabel: "nach P10", outLabel: "nach LS-1", inHalves: ["links", "rechts"], outHalves: ["links", "rechts"] }),
      { hint: true });
    add(G1, "P8 → K1", "Permutation P8 ergibt K1",
      "P8 wählt 8 der 10 Bits aus und ordnet sie neu. Die Bits an Position 1 und 2 fallen weg. Das Ergebnis ist der erste Rundenschlüssel K1.",
      () => permSVG({ inBits: d.a, table: T.P8, inSplit: 5, inLabel: "nach LS-1", outLabel: "K1" }),
      { code: tcode("P8", T.P8), hint: true, rec: ["K1", d.k1] });
    add(G1, "LS-2", "Linksshift um 2",
      "Ausgangspunkt ist das Ergebnis von LS-1, nicht K1. Beide Hälften werden nochmals zyklisch um 2 Positionen nach links verschoben.",
      () => permSVG({ inBits: d.a, table: T.LS2, inSplit: 5, outSplit: 5, inLabel: "nach LS-1", outLabel: "nach LS-2", inHalves: ["links", "rechts"], outHalves: ["links", "rechts"] }),
      { hint: true });
    add(G1, "P8 → K2", "Permutation P8 ergibt K2",
      "Dieselbe Tabelle P8 wie vorher, angewendet auf das Ergebnis von LS-2. Das ergibt den zweiten Rundenschlüssel K2. Damit ist die Schlüsselerzeugung fertig.",
      () => permSVG({ inBits: d.b, table: T.P8, inSplit: 5, inLabel: "nach LS-2", outLabel: "K2" }),
      { code: tcode("P8", T.P8), hint: true, rec: ["K2", d.k2] });

    add(G2, "Klartext", "Der 8-Bit-Klartext",
      "Verschlüsselt wird ein Block von 8 Bit. Ab hier beginnt die eigentliche Verschlüsselung mit den beiden Rundenschlüsseln.",
      () => `<div class="rows">${row("<b>Klartext</b>", d.pt)}${row("K1", d.k1)}${row("K2", d.k2)}</div>`);
    add(G2, "IP", "Initialpermutation IP",
      "Die 8 Bits werden nach IP umgeordnet. Danach wird der Block in eine linke Hälfte L und eine rechte Hälfte R zu je 4 Bit geteilt.",
      () => permSVG({ inBits: d.pt, table: T.IP, outSplit: 4, inLabel: "Klartext", outLabel: "nach IP", outHalves: ["L", "R"] }),
      { code: tcode("IP", T.IP), hint: true, rec: ["nach IP", d.ip] });

    [[d.r1, "K1", d.k1, 1], [d.r2, "K2", d.k2, 2]].forEach(([r, kn, k, n]) => {
      const G = `Runde ${n} · ${kn}`;
      const inName = n === 1 ? "nach IP" : "nach SW";
      add(G, "Expansion E/P", `Runde ${n}: Expansion E/P`,
        `Die Rundenfunktion F arbeitet nur mit der rechten Hälfte R. Die Expansionspermutation E/P macht aus 4 Bit 8 Bit, indem jedes Bit zweimal verwendet wird.`,
        () => `<div class="rows" style="margin-bottom:14px">${row(`<b>${inName}</b> (L | R)`, [...r.L, ...r.R], { split: 4, dim: [0, 1, 2, 3] })}</div>` +
          permSVG({ inBits: r.R, table: T.EP, outSplit: 4, inLabel: "R", outLabel: "E/P(R)" }),
        { code: tcode("E/P", T.EP), hint: true });
      add(G, `XOR mit ${kn}`, `Runde ${n}: XOR mit ${kn}`,
        `Die 8 Bit werden bitweise mit ${kn} verknüpft. XOR ergibt 1, wenn die beiden Bits verschieden sind, sonst 0. Nur an dieser Stelle fliesst der Schlüssel in die Verschlüsselung ein.`,
        () => xorViz(r.ep, "E/P(R)", k, kn, r.x, `<b>Ergebnis</b>`, { split: 4 }));
      add(G, "S-Boxen", `Runde ${n}: S-Boxen S0 und S1`,
        `Die linken 4 Bit gehen in S0, die rechten 4 Bit in S1. Bit 1 und 4 bestimmen die Zeile, Bit 2 und 3 die Spalte. Der Tabellenwert (0 bis 3) wird als 2 Bit ausgegeben. Die S-Boxen sind der einzige nichtlineare Teil von S-DES.`,
        () => `<div class="legend"><span class="lr">Zeile: Bit 1 und 4</span><span class="lc">Spalte: Bit 2 und 3</span></div>` +
          `<div class="sboxes" style="margin-top:14px">${sboxPanel("S0", S0, r.s0)}${sboxPanel("S1", S1, r.s1)}</div>`);
      add(G, "P4", `Runde ${n}: Permutation P4`,
        `Die 4 Ausgabebits der S-Boxen werden mit P4 umgeordnet. Das Ergebnis ist der Wert der Rundenfunktion F(R, ${kn}).`,
        () => permSVG({ inBits: r.sOut, table: T.P4, inSplit: 2, inLabel: "S0 | S1", outLabel: `F(R, ${kn})` }),
        { code: tcode("P4", T.P4), hint: true });
      add(G, "L ⊕ F", `Runde ${n}: L mit F verknüpfen`,
        `Die linke Hälfte L wird per XOR mit F(R, ${kn}) verknüpft. Die rechte Hälfte R bleibt unverändert. Dieser Aufbau heisst Feistel-Runde und ist auch die Grundlage von DES.`,
        () => xorViz(r.L, "L", r.p4, `F(R, ${kn})`, r.L2, "<b>neues L</b>") +
          `<div class="rows" style="margin-top:18px">${row(`<b>Ergebnis Runde ${n}</b> (L | R)`, r.out, { split: 4 })}</div>`,
        { rec: [`nach Runde ${n}`, r.out] });
      if (n === 1) add(G, "SW", "Vertauschen SW",
        "Die beiden Hälften werden vertauscht. So verändert Runde 2 die andere Hälfte, die in Runde 1 unverändert geblieben ist.",
        () => permSVG({ inBits: d.r1.out, table: T.SW, inSplit: 4, outSplit: 4, inLabel: "nach Runde 1", outLabel: "nach SW", inHalves: ["L", "R"], outHalves: ["L", "R"] }),
        { code: tcode("SW", T.SW), hint: true, rec: ["nach SW", d.sw] });
    });

    add(G5, "IP⁻¹", "Inverse Initialpermutation IP⁻¹",
      "IP⁻¹ macht die Initialpermutation vom Anfang rückgängig. Nach Runde 2 wird nicht mehr vertauscht. Das Ergebnis ist der Geheimtext.",
      () => permSVG({ inBits: d.r2.out, table: T.IPI, inSplit: 4, inLabel: "nach Runde 2", outLabel: "Geheimtext" }),
      { code: tcode("IP⁻¹", T.IPI), hint: true, rec: ["Geheimtext", d.ct] });
    add(G5, "Übersicht", "Ergebnis",
      "Aus 8 Bit Klartext und 10 Bit Schlüssel sind 8 Bit Geheimtext entstanden. Der Ablauf war: IP, Runde mit K1, SW, Runde mit K2, IP⁻¹. Zum Entschlüsseln läuft derselbe Ablauf, nur mit K2 in der ersten und K1 in der zweiten Runde.",
      () => `<div class="rows">${row("Klartext", d.pt)}${row("Schlüssel", d.key)}${rule()}${row("<b>Geheimtext</b>", d.ct)}</div>`);
    return st;
  }

  // ---------- Zustand ----------
  const EX = { pt: "10010111", key: "1010000010" };
  let state = { pt: EX.pt, key: EX.key, i: 0 };
  let steps = [];
  const $ = id => document.getElementById(id);
  const app = $("app"), root = document.documentElement;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  function recompute() {
    const d = compute(state.pt.split("").map(Number), state.key.split("").map(Number));
    steps = buildSteps(d);
    $("ctOut").textContent = str(d.ct);
    renderList(); render();
  }
  function renderList() {
    let h = "", g = null;
    steps.forEach((s, i) => {
      if (s.group !== g) { if (g !== null) h += `</ol>`; g = s.group; h += `<div class="grp">${esc(g)}</div><ol>`; }
      h += `<li><button type="button" data-i="${i}"><span class="n">${i + 1}</span><span class="t">${esc(s.short)}</span></button></li>`;
    });
    $("stepList").innerHTML = h + `</ol>`;
  }
  function render() {
    const s = steps[state.i];
    $("grpName").textContent = s.group;
    $("cnt").textContent = `Schritt ${state.i + 1} / ${steps.length}`;
    $("title").textContent = s.title;
    $("expl").textContent = s.text;
    $("tableCode").innerHTML = s.code || "";
    $("viz").innerHTML = s.viz();
    $("hint").textContent = s.hint ? "Tipp: Ein Ausgabebit überfahren oder antippen, um seine Linie hervorzuheben." : "";
    $("bar").style.width = ((state.i + 1) / steps.length * 100) + "%";
    $("prev").disabled = state.i === 0;
    $("next").disabled = state.i === steps.length - 1;
    document.querySelectorAll("#stepList button").forEach(b => {
      const i = +b.dataset.i;
      b.classList.toggle("done", i < state.i);
      if (i === state.i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    const recs = steps.slice(0, state.i + 1).filter(x => x.rec);
    $("vals").innerHTML = recs.length
      ? `<dl>${recs.map(x => `<div class="v${x === s ? " new" : ""}"><dt>${esc(x.rec[0])}</dt><dd>${str(x.rec[1])}</dd></div>`).join("")}</dl>`
      : `<p class="empty">Noch keine. K1 erscheint nach Schritt 4.</p>`;
  }
  function go(i) { state.i = Math.max(0, Math.min(steps.length - 1, i)); render(); }

  // ---------- Eingaben ----------
  function validate(id, len) {
    const el = $(id), v = el.value.trim(), err = $(id + "Err");
    let msg = "";
    if (!/^[01]*$/.test(v)) msg = "Nur 0 und 1 erlaubt";
    else if (v.length !== len) msg = `Genau ${len} Bit nötig (jetzt ${v.length})`;
    el.setAttribute("aria-invalid", msg ? "true" : "false");
    err.textContent = msg;
    return msg ? null : v;
  }
  function onInput() {
    const pt = validate("pt", 8), key = validate("key", 10);
    if (pt && key && (pt !== state.pt || key !== state.key)) { state.pt = pt; state.key = key; recompute(); }
  }
  function setInputs(pt, key) {
    $("pt").value = pt; $("key").value = key;
    validate("pt", 8); validate("key", 10);
    state.pt = pt; state.key = key; recompute();
  }
  const rnd = n => Array.from({ length: n }, () => Math.random() < .5 ? 0 : 1).join("");

  $("pt").addEventListener("input", onInput);
  $("key").addEventListener("input", onInput);
  $("form").addEventListener("submit", e => e.preventDefault());
  $("example").addEventListener("click", () => setInputs(EX.pt, EX.key));
  $("random").addEventListener("click", () => setInputs(rnd(8), rnd(10)));
  $("prev").addEventListener("click", () => go(state.i - 1));
  $("next").addEventListener("click", () => go(state.i + 1));
  $("stepList").addEventListener("click", e => {
    const b = e.target.closest("button[data-i]");
    if (!b) return;
    go(+b.dataset.i);
    if (window.matchMedia("(max-width: 860px)").matches) $("stepsDetails").open = false;
  });
  document.addEventListener("keydown", e => {
    if (e.target.matches("input, textarea")) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); go(state.i + 1); }
    if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(state.i - 1); }
    if (e.key === "Home") go(0);
    if (e.key === "End") go(steps.length - 1);
  });

  // ---------- Variante & Beamer ----------
  function setVariant(v) {
    app.dataset.variant = v; root.dataset.variant = v;
    $("varA").setAttribute("aria-pressed", v === "a"); $("varB").setAttribute("aria-pressed", v === "b");
    store.set("sdes-variant", v);
  }
  function setBeamer(on) {
    if (on) root.dataset.beamer = "1"; else delete root.dataset.beamer;
    $("beamer").setAttribute("aria-pressed", on);
    store.set("sdes-beamer", on ? "1" : "0");
  }
  $("varA").addEventListener("click", () => setVariant("a"));
  $("varB").addEventListener("click", () => setVariant("b"));
  $("beamer").addEventListener("click", () => setBeamer(root.dataset.beamer !== "1"));

  const mq = window.matchMedia("(max-width: 860px)");
  $("stepsDetails").open = !mq.matches;
  mq.addEventListener("change", e => { $("stepsDetails").open = !e.matches; });

  setVariant(store.get("sdes-variant") === "b" ? "b" : "a");
  setBeamer(store.get("sdes-beamer") === "1");
  $("pt").value = state.pt; $("key").value = state.key;
  recompute();
})();
</script>

</body></html>
